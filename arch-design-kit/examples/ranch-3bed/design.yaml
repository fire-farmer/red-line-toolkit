# Design spec: the single source of truth for a project (playbook W-2).
# Claude edits THIS file first; plans, models and renders are generated from it.
#
# Conventions (playbook D-1):
#   - All lengths in the declared `units`. Here: inches.
#   - Plan axes: +x = east, +y = north, origin = south-west corner of the main house.
#   - rect: [x, y, width_along_x, depth_along_y], measured to the INSIDE face of the
#     room's walls (net room size), the way a designer dimensions a room.
#   - Elevations are finished-floor elevations.

project:
  name: Example Ranch (3 bed / 2 bath)
  units: in
  phase: schematic            # programming | schematic | design-development | construction-documents
  jurisdiction:
    country: US
    code: IRC 2021            # set to what the Authority Having Jurisdiction (AHJ) has adopted
    energy_code: IECC 2021
    ahj: TBD (confirm local amendments)
    climate_zone: 4A
  style: modern-farmhouse     # a module in playbook/styles/
  concept:                    # playbook 08, CR-IDEA-1 / CR-KEEP-1
    status: chosen
    id: C-03
    statement: "One long, low bar that splits family life from sleep, with every main room facing the south garden."
    key_move: "Bedroom wings at both ends; the public middle opens south to the garden."
    gives_up: "Some walking distance; the primary suite sits far from the kids' rooms."
    invariants:
      - {glazing_share: {wall: S, min: 0.5}}
      - {room: GREAT, min_length_in: 288}
      - "the two bedroom wings stay at opposite ends of the bar"
    moments:
      - "morning coffee at the great room's south windows"
  fuel_fired_appliances: false  # gas range/furnace/water heater -> CO alarm rules apply
  universal_design: true      # adds the playbook's aging-in-place checks

site:
  lot_in: [1200, 1680]        # 100 ft x 140 ft lot
  setbacks_in: {north: 300, south: 300, east: 96, west: 96}   # street on the north
  street_side: north
  building_origin_in: [120, 600]   # where the plan origin sits on the lot

roof:
  form: gable
  pitch: "8:12"
  framing: trusses            # trusses | rafters
  clear_span_in: 372          # 30 ft house depth plus exterior walls
  overhang_in: 18

levels:
  - id: L1
    name: Main level
    elevation_in: 0
    ceiling_in: 108           # 9 ft plate
    egress_doors:
      - {id: D-ENTRY, room: ENTRY, wall: N, width_in: 36, clear_width_in: 34, clear_height_in: 79.5}   # 3'-0" x 6'-8" door
    alarms:
      - {type: smoke, room: BR2}
      - {type: smoke, room: BR3}
      - {type: smoke, room: PRIMARY}
      - {type: combo, room: HALL}         # smoke + CO, outside the sleeping rooms
      - {type: combo, room: GREAT}
    rooms:
      # West wing: secondary bedrooms off a short hall
      - {id: BR2, name: Bedroom 2, type: bedroom, rect: [0, 0, 132, 132],
         doors: [{to: HALL, width_in: 32}],
         windows: [{wall: S, width_in: 30, height_in: 60, sill_in: 24,
                    egress: {net_clear_w_in: 26, net_clear_h_in: 54}},
                   {wall: W, width_in: 30, height_in: 60, sill_in: 24}]}
      - {id: BATH2, name: Bath 2, type: bath, rect: [0, 132, 132, 96],
         doors: [{to: HALL, width_in: 32}],
         fixtures: {wc: {side_clear_in: 18, front_clear_in: 30},
                    tub_shower: {w_in: 60, d_in: 32}}}
      - {id: BR3, name: Bedroom 3, type: bedroom, rect: [0, 228, 132, 132],
         doors: [{to: HALL, width_in: 32}],
         windows: [{wall: N, width_in: 30, height_in: 60, sill_in: 24,
                    egress: {net_clear_w_in: 26, net_clear_h_in: 54}},
                   {wall: W, width_in: 30, height_in: 60, sill_in: 24}]}
      - {id: LINEN, name: Linen, type: closet, rect: [132, 0, 42, 96],
         doors: [{to: HALL, width_in: 30}]}
      - {id: HALL, name: Hall, type: hall, rect: [132, 96, 42, 264],
         open_to: [GREAT, ENTRY]}

      # Middle: public zone; the great room faces south (P-ORIENT-1)
      - {id: GREAT, name: Great Room, type: living, rect: [174, 0, 300, 192],
         open_to: [KITCHEN],
         windows: [{wall: S, width_in: 72, height_in: 84, sill_in: 12},
                   {wall: S, width_in: 72, height_in: 84, sill_in: 12},
                   {wall: S, width_in: 36, height_in: 84, sill_in: 12}]}
      - {id: COAT, name: Coat / Storage, type: closet, rect: [174, 192, 54, 84],
         doors: [{to: ENTRY, width_in: 30}]}
      - {id: PANTRY, name: Pantry, type: pantry, rect: [228, 192, 66, 84],
         doors: [{to: KITCHEN, width_in: 30}]}
      - {id: ENTRY, name: Entry, type: foyer, rect: [174, 276, 120, 84],
         open_to: [KITCHEN]}
      - {id: KITCHEN, name: Kitchen, type: kitchen, rect: [294, 192, 180, 168],
         kitchen: {work_aisle_in: 48, cooks: 2},
         windows: [{wall: N, width_in: 60, height_in: 42, sill_in: 42}]}

      # East wing: primary suite, and the garage entry through mud + laundry (service spine, P-ZONE-1)
      - {id: PRIMARY, name: Primary Bedroom, type: bedroom, rect: [474, 0, 198, 168],
         doors: [{to: GREAT, width_in: 36}],
         windows: [{wall: S, width_in: 36, height_in: 60, sill_in: 24,
                    egress: {net_clear_w_in: 32, net_clear_h_in: 54}},
                   {wall: S, width_in: 36, height_in: 60, sill_in: 24},
                   {wall: E, width_in: 36, height_in: 60, sill_in: 24, offset_in: 18}]}   # garage starts 6 ft up this wall
      - {id: WIC, name: Walk-in Closet, type: closet, rect: [474, 168, 66, 108],
         doors: [{to: PRIMARY, width_in: 30}]}
      - {id: PBATH, name: Primary Bath, type: bath, rect: [540, 168, 132, 108],
         doors: [{to: PRIMARY, width_in: 32}],
         fixtures: {wc: {side_clear_in: 18, front_clear_in: 30},
                    shower: {w_in: 60, d_in: 36}}}
      - {id: LAUNDRY, name: Laundry, type: laundry, rect: [474, 276, 114, 84],
         open_to: [KITCHEN],
         windows: [{wall: N, width_in: 30, height_in: 36, sill_in: 48}]}   # dryer vents out this wall (M-DRYER-1)
      - {id: MUD, name: Mudroom, type: mudroom, rect: [588, 276, 84, 84],
         doors: [{to: LAUNDRY, width_in: 32}]}

      # Attached garage (unconditioned): triggers the separation rules
      - {id: GARAGE, name: Garage, type: garage, rect: [672, 72, 264, 288],
         opens_to: [MUD]}
    garage_separation:
      wall: 1/2 in. gypsum board on the garage side (R302.6)
      ceiling: none above (single story); 1/2 in. gypsum on garage ceiling
      door: 1-3/8 in. solid-core wood, self-closing (R302.5.1)
