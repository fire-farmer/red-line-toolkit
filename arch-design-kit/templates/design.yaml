      #   rect: [0, 0, 132, 132]
      #   doors: [{to: HALL, width_in: 32}]   # on the shared wall; swings into THIS room; offset_in optional
      #   open_to: [GREAT]              # cased opening / open plan, no door (G-CONN-1 reachability)
