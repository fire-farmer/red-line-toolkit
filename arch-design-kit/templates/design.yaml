# design.yaml: the project's single source of truth (playbook W-SPEC-1, 06).
# Copy into the project folder, then fill in with Claude during schematic design.
# Check:     python3 <kit>/tools/check_design.py design.yaml
# Plans:     python3 <kit>/tools/render_plan.py design.yaml out/
# IFC model: python3 <kit>/tools/spec_to_ifc.py design.yaml out/model.ifc
#
# Conventions (D-UNITS-1, D-AXES-1):
#   units: in -> every *_in value is inches (use "mm" for metric; the keys keep their names)
#   +x = east, +y = north, origin = south-west corner of the main house, z = finished floor
#   rect: [x, y, width_along_x, depth_along_y]  = NET room size (inside finished walls)

project:
  name: <project name>
  units: in
  phase: schematic                # programming | schematic | design-development | construction-documents
  jurisdiction:
    country: US
    code: IRC 2021                # the edition the AHJ adopted
    energy_code: IECC 2021
    ahj: <city/county>
    climate_zone: <e.g. 4A>
  style: <module from playbook/styles/catalog.md>
  concept:                        # playbook 08: set by the concept phase (CR-GATE-1, CR-KEEP-1)
    status: exploring             # exploring | chosen | skipped
    id:                           # e.g. C-04 from CONCEPTS.md
    statement:                    # one sentence, the generative idea (not a style, not a feature list)
    # skip_reason: "owner wants a straightforward builder-style plan"   # only with status: skipped
  fuel_fired_appliances: false    # gas or other fuel appliances -> CO alarm rules (C-ALARM-3)
  universal_design: false         # true -> SP-UD checks

site:
  lot_in: [0, 0]                  # [width along x, depth along y]; 0 = not entered yet
  setbacks_in: {north: 0, south: 0, east: 0, west: 0}
  street_side: <north|south|east|west>
  building_origin_in: [0, 0]      # where the plan origin sits on the lot

roof:
  form: gable                     # gable | hip | shed | flat | cross-gable | butterfly
  pitch: "6:12"
  framing: trusses                # trusses | rafters
  cathedral: false                # rafters without ties -> ridge beam (S-ROOF-2)
  clear_span_in: 0
  overhang_in: 18

# Local amendments only. Give every override a reason (02, W-DEC-1).
limits: {}
#  hall_min_w_in: {value: 42, reason: "City of X amendment 12.3"}

levels:
  - id: L1
    name: Main level
    elevation_in: 0
    ceiling_in: 108
    # below_grade: true           # basement: habitable rooms need escape openings, grade-floor area allowed
    egress_doors:
      - {id: D-ENTRY, room: ENTRY, wall: N, width_in: 36, clear_width_in: 34, clear_height_in: 79.5}
    alarms:
      # - {type: smoke, room: BR2}      # smoke | co | combo; every bedroom + outside sleeping areas + every story
    rooms:
      # - id: BR2
